# Despliegue en Render (plan gratuito): https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tallerya
    runtime: docker
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SERVE_MEDIA
        value: "True"
      - key: SEED_ARGS
        value: "--demo"
