{% extends 'core/base.html' %}
{% block title %}Crear cuenta · Garage360{% endblock %}

{% block contenido %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">
            <form method="POST" class="p-4 p-md-5">
                {% csrf_token %}
                <h1 class="h3 fw-bold text-center mb-4">Crea tu cuenta</h1>
                {% include 'core/_form_fields.html' %}
                <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Registrarme</button>
                <p class="text-center text-secondary mt-4 mb-0">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="fw-semibold">Inicia sesión</a></p>
            </form>
        </div>
    </div>
</div>
{% endblock contenido %}
