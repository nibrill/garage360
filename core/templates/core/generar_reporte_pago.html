{% extends 'core/base.html' %}
{% load static %}
{% load ui %}
{% block contenido %}

<!-- INICIO ENCABEZADO -->
<section class="page-hero">
    <div class="container"><h1>Generar reporte de pago</h1></div>
</section>
<!-- FIN ENCABEZADO -->

<div class="bg-page">
    <div class="container mt-4">
        <div class="row justify-content-center mt-4 mb-5">
          <div class="col-md-8">
            <form id="reporteForm" method="POST" class="p-4 rounded shadow-lg">
              {% csrf_token %}
              {% include 'core/_form_fields.html' %}
              <button type="button" class="btn rounded-pill btn-background btn-lg mt-5 d-flex text-center mx-auto" onclick="confirmarReporte()">GENERAR REPORTE</button>
            </form>
          </div>
        </div>
    </div>
</div>

{% endblock contenido %}
{% block js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  function confirmarReporte() {
    Swal.fire({
      title: '¿Estás seguro?',
      text: "Estás a punto de generar un reporte de pago.",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Sí, generar reporte',
      cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        document.getElementById('reporteForm').submit();
      }
    })
  }
</script>
{% endblock js %}
