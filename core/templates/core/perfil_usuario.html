{% extends 'core/base.html' %}
{% load static %}
{% load ui %}
{% block contenido %}

<!-- INICIO ENCABEZADO -->
<section class="page-hero">
    <div class="container"><h1>Perfil usuario</h1></div>
</section>
<!-- FIN ENCABEZADO -->

<div class="bg-white">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center mt-4 mb-5">
          <div class="col-md-8">
            <form method="POST" class="p-4 rounded shadow-lg">
              {% csrf_token %}
              <div class="form-group">
                {% include 'core/_form_fields.html' %}
              </div>
              <input type="submit" class="btn rounded-pill btn-background btn-lg mt-5 d-flex text-center mx-auto" value="Modificar perfil">
            </form>
          </div>
        </div>
<br>
    </div>

</div>

{% endblock contenido %}
{% block js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock js %}
