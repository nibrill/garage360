{% extends 'core/base.html' %}
{% load static %}
{% load ui %}
{% block contenido %}

<!-- INICIO ENCABEZADO -->
<section class="page-hero">
    <div class="container"><h1>Modificar usuario</h1></div>
</section>
<!-- FIN ENCABEZADO -->

<div class="bg-white">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center mt-4 mb-5">
            <div class="col-md-8">
                <form method="POST" class="p-4 rounded shadow-lg" id="formModificarUsuario">
                    {% csrf_token %}
                    <div class="form-group">
                        {% include 'core/_form_fields.html' %}
                    </div>
                    <div class="text-center">
                      <button type="button" class="btn btn-primary btn-lg mt-3 rounded-5 text-center mx-auto align-items-center" id="btnModificarUsuario">Modificar usuario</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

{% endblock contenido %}
{% block js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    $(document).ready(function () {
        // Función para mostrar la alerta antes de modificar el usuario
        $('#btnModificarUsuario').click(function () {
            Swal.fire({
                title: '¿Está seguro de que desea modificar este usuario?',
                text: 'Esta acción actualizará los datos del usuario',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, modificar usuario'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Envía el formulario para la modificación
                    $('#formModificarUsuario').submit();
                }
            });
        });
    });
</script>
{% endblock js %}
