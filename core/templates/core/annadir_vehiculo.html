{% extends 'core/base.html' %}
{% load static %}
{% load ui %}

{% block contenido %}

<!-- INICIO ENCABEZADO -->
<section class="page-hero">
    <div class="container"><h1>Añadir vehículo</h1></div>
</section>
<!-- FIN ENCABEZADO -->

<div class="bg-page">
    <div class="container mt-4">
        <div class="row justify-content-center mt-4 mb-5">
            <div class="col-md-8">
                <form id="addVehicleForm" method="POST" class="p-4 rounded shadow-lg">
                    {% csrf_token %}
                    <div class="form-group">
                        {% include 'core/_form_fields.html' %}
                    </div>
                    <button type="submit" class="btn rounded-pill btn-background btn-lg mt-5 d-flex text-center mx-auto" id="btnSubmit">Añadir vehículo</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock contenido %}

{% block js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // Confirmación antes de enviar el formulario
    $(document).ready(function () {
        $('#addVehicleForm').submit(function (event) {
            event.preventDefault();  // Evita el envío automático del formulario

            Swal.fire({
                title: '¿Está seguro de que desea añadir el vehículo?',
                text: 'Esta acción no se puede deshacer',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, añadir vehículo',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Si el usuario confirma, proceder con el envío del formulario
                    $('#addVehicleForm')[0].submit();
                }
            });
        });
    });
</script>
{% endblock js %}
