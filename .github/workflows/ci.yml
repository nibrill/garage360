name: CI
on: [push, pull_request]

jobs:
  test-mysql:
    name: Tests (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: garage360
          MYSQL_USER: garage360
          MYSQL_PASSWORD: garage360_dev
          MYSQL_ROOT_PASSWORD: root_dev
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_dev"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_ENGINE: mysql
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py test --verbosity 2

  test-sqlite:
    name: Tests (SQLite, modo rápido)
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test
